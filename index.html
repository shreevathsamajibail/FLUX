<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Historian Chat Engine</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0a0a0c; --surface: #121217; --surface2: #1c1c24; --border: rgba(255,255,255,0.08);
  --accent: #c8ff00; --text: #f0f0f5; --text2: #8a8a9d; --font: 'Syne', sans-serif;
}
body, html { margin:0; padding:0; height:100%; background:var(--bg); color:var(--text); font-family:var(--font); overflow:hidden; }

/* AUTH SCREEN */
#auth-screen { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:2000; }
.auth-card { background:var(--surface); padding:40px; border-radius:30px; width:320px; text-align:center; border:1px solid var(--border); }
.pin-digit { width:50px; height:60px; background:var(--surface2); border:1px solid var(--border); border-radius:12px; color:var(--accent); font-size:24px; text-align:center; margin:0 5px; outline:none; }

/* LAYOUT */
#app { display:none; display:flex; height:100vh; flex-direction:column; }

/* TOP BAR (Identities) */
.identity-bar { background:var(--surface); border-bottom:1px solid var(--border); padding:10px 20px; display:flex; align-items:center; gap:15px; overflow-x:auto; }
.guild-chip { display:flex; align-items:center; gap:10px; background:var(--surface2); padding:6px 12px; border-radius:100px; cursor:pointer; border:1px solid transparent; transition:0.2s; white-space:nowrap; }
.guild-chip.active { border-color:var(--accent); background:rgba(200,255,0,0.1); }
.guild-chip img { width:24px; height:24px; border-radius:50%; background:#000; }
.guild-chip span { font-size:12px; font-weight:700; }

/* CHAT AREA */
.chat-container { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:20px; scroll-behavior:smooth; }
.msg { max-width:80%; display:flex; flex-direction:column; gap:8px; }
.msg.system { align-self:flex-start; }
.msg.user { align-self:flex-end; align-items:flex-end; }
.bubble { padding:15px 20px; border-radius:20px; font-size:14px; line-height:1.5; }
.system .bubble { background:var(--surface); border:1px solid var(--border); border-bottom-left-radius:4px; }
.user .bubble { background:var(--accent); color:#000; font-weight:600; border-bottom-right-radius:4px; }

/* GENERATED RESULT BUBBLE */
.res-card { background:var(--surface); border:1px solid var(--border); border-radius:20px; overflow:hidden; width:100%; max-width:500px; }
.res-img { width:100%; aspect-ratio:1/1; background:#000; display:flex; align-items:center; justify-content:center; }
.res-img img { width:100%; height:100%; object-fit:cover; }
.res-body { padding:20px; }
.save-status { font-size:10px; font-family: 'DM Mono'; text-transform:uppercase; color:var(--accent); margin-bottom:10px; display:flex; align-items:center; gap:5px; }

/* INPUT AREA */
.input-area { background:var(--surface); border-top:1px solid var(--border); padding:20px; display:flex; gap:15px; align-items:center; }
.chat-input { flex:1; background:var(--surface2); border:1px solid var(--border); padding:15px 20px; border-radius:15px; color:#white; outline:none; font-family:var(--font); }
.icon-btn { background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:12px; border-radius:12px; cursor:pointer; }
.icon-btn.active { color:var(--accent); border-color:var(--accent); }

/* SIDE DRAWER */
.drawer { position:fixed; right:-300px; top:0; bottom:0; width:300px; background:var(--surface); border-left:1px solid var(--border); transition:0.3s; z-index:1000; padding:20px; }
.drawer.open { right:0; }

.spinner { width:20px; height:20px; border:3px solid rgba(200,255,0,0.2); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-card">
    <div style="background:var(--accent); width:50px; height:50px; border-radius:12px; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; color:#000; font-weight:900;">H</div>
    <h3>Archive PIN</h3>
    <div style="display:flex; justify-content:center; margin-bottom:20px;">
        <input class="pin-digit" id="p0" type="password" maxlength="1" oninput="moveFocus(0)"/>
        <input class="pin-digit" id="p1" type="password" maxlength="1" oninput="moveFocus(1)"/>
        <input class="pin-digit" id="p2" type="password" maxlength="1" oninput="moveFocus(2)"/>
        <input class="pin-digit" id="p3" type="password" maxlength="1" oninput="moveFocus(3)"/>
    </div>
    <button onclick="login()" style="width:100%; padding:15px; background:var(--accent); border:none; border-radius:10px; font-weight:800; cursor:pointer;">ACCESS ARCHIVE</button>
    <p id="auth-msg" style="font-size:10px; color:var(--text2); margin-top:15px;">New PIN? It will auto-register.</p>
  </div>
</div>

<div id="app">
  <!-- Identity/Guild Selector -->
  <div class="identity-bar" id="guild-bar">
    <div style="font-size:11px; color:var(--text2); font-weight:700; margin-right:10px;">GUILD:</div>
    <!-- Chips injected here -->
    <button class="guild-chip" onclick="toggleDrawer()"><span>+ Add Guild</span></button>
  </div>

  <!-- Chat History -->
  <div class="chat-container" id="chat-flow">
    <div class="msg system">
        <div class="bubble">System Online. Select a Guild and type a topic to begin forging.</div>
    </div>
  </div>

  <!-- Input Area -->
  <div class="input-area">
    <button class="icon-btn" id="folder-btn" title="Connect Local Folder" onclick="connectLocalFolder()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
    </button>
    <button class="icon-btn" title="Import CSV" onclick="document.getElementById('csv-file').click()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </button>
    <input type="file" id="csv-file" hidden accept=".csv,.xlsx" onchange="handleCSV(this)"/>
    <input type="text" class="chat-input" id="chat-input" placeholder="Type a topic (e.g. The Fall of Samurai)..." onkeydown="if(event.key==='Enter') sendMessage()"/>
    <button class="icon-btn" style="background:var(--accent); color:#000;" onclick="sendMessage()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>

  <!-- Settings Drawer -->
  <div class="drawer" id="drawer">
    <h3>Guild Settings</h3>
    <label style="font-size:10px;">NAME</label>
    <input type="text" id="new-g-name" placeholder="Ancient History"/>
    <label style="font-size:10px;">LOGO</label>
    <input type="file" id="new-g-logo" accept="image/*"/>
    <button onclick="saveNewGuild()" style="width:100%; padding:10px; background:var(--accent); border:none; margin-top:10px;">Register Guild</button>
    
    <hr style="margin:20px 0; border:var(--border)"/>
    <h3>Vault</h3>
    <input type="password" id="gemini-key" placeholder="Gemini API Key"/>
    <input type="url" id="flux-url" placeholder="FLUX Worker URL"/>
    <button onclick="saveVault()" style="width:100%; padding:10px; background:var(--surface2); color:white; border:none; margin-top:10px;">Save Keys</button>
    
    <button onclick="toggleDrawer()" style="margin-top:20px; background:none; border:none; color:var(--text2); cursor:pointer;">Close Settings</button>
  </div>
</div>

<script>
const PROXY = 'https://flux-proxey.shreevathsa2k27.workers.dev/'; // REPLACE WITH YOUR PROXY
let currentPin = '';
let userData = { profiles: [], apiKeys: [], workers: [], results: [] };
let activeGuildId = null;
let directoryHandle = null;

// --- AUTH LOGIC ---
function moveFocus(i) { if(document.getElementById('p'+i).value && i<3) document.getElementById('p'+(i+1)).focus(); }
async function login() {
    const pin = [0,1,2,3].map(i=>document.getElementById('p'+i).value).join('');
    if(pin.length < 4) return;
    
    try {
        const res = await fetch(PROXY, { method:'POST', body: JSON.stringify({action:'login', pin}) }).then(r=>r.json());
        if(res.error) {
            await fetch(PROXY, { method:'POST', body: JSON.stringify({action:'register', pin}) });
        }
        currentPin = pin;
        await loadData();
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
    } catch(e) { alert("Auth Error: Check Proxy"); }
}

async function loadData() {
    const res = await fetch(PROXY, { method:'POST', body: JSON.stringify({action:'load', pin: currentPin}) }).then(r=>r.json());
    if(res.data) userData = res.data;
    renderGuilds();
    if(userData.apiKeys[0]) document.getElementById('gemini-key').value = userData.apiKeys[0];
    if(userData.workers[0]) document.getElementById('flux-url').value = userData.workers[0];
}

async function syncToCloud() {
    await fetch(PROXY, { method:'POST', body: JSON.stringify({action:'save', pin: currentPin, data: userData}) });
}

// --- FOLDER LOGIC ---
async function connectLocalFolder() {
    try {
        directoryHandle = await window.showDirectoryPicker();
        document.getElementById('folder-btn').classList.add('active');
        addChatMessage("system", `Local folder connected: ${directoryHandle.name}. Generations will now auto-save.`);
        // Option to move existing files
        if(userData.results.length > 0) {
            addChatMessage("system", `<button class="icon-btn" style="font-size:10px" onclick="moveAllToLocal()">Move existing archive to this folder?</button>`);
        }
    } catch(e) { console.log("Folder access denied"); }
}

async function saveToLocal(topic, imageBlob, textContent, guildName) {
    if(!directoryHandle) return false;
    try {
        const subFolder = await directoryHandle.getDirectoryHandle(guildName.replace(/[^a-z0-9]/gi, '_'), {create: true});
        const safeTopic = topic.replace(/[^a-z0-9]/gi, '_').substring(0, 30);
        
        // Save Image
        const imgFile = await subFolder.getFileHandle(`${safeTopic}.jpg`, {create: true});
        const imgWriter = await imgFile.createWritable();
        await imgWriter.write(imageBlob);
        await imgWriter.close();

        // Save Text
        const txtFile = await subFolder.getFileHandle(`${safeTopic}.txt`, {create: true});
        const txtWriter = await txtFile.createWritable();
        await txtWriter.write(textContent);
        await txtWriter.close();
        
        return true;
    } catch(e) { return false; }
}

async function moveAllToLocal() {
    if(!directoryHandle) return;
    addChatMessage("system", "Exporting archive to local disk...");
    for(let res of userData.results) {
        const blob = await fetch(res.image).then(r=>r.blob());
        await saveToLocal(res.topic, blob, res.long, res.guild);
    }
    addChatMessage("system", "Local export complete.");
}

// --- CHAT LOGIC ---
function addChatMessage(type, content, isResult = false) {
    const flow = document.getElementById('chat-flow');
    const msg = document.createElement('div');
    msg.className = `msg ${type}`;
    msg.innerHTML = `<div class="bubble">${content}</div>`;
    flow.appendChild(msg);
    flow.scrollTop = flow.scrollHeight;
    return msg;
}

async function sendMessage() {
    const input = document.getElementById('chat-input');
    const topic = input.value.trim();
    if(!topic || !activeGuildId) return;

    const guild = userData.profiles.find(p=>p.id === activeGuildId);
    input.value = '';
    addChatMessage("user", topic);
    
    const loadingMsg = addChatMessage("system", `<div style="display:flex; align-items:center; gap:10px"><div class="spinner"></div> Forging history for ${guild.name}...</div>`);
    
    try {
        // 1. Gemini
        const geminiKey = userData.apiKeys[0];
        const prompt = `Topic: ${topic}. Guild Identity: ${guild.name}. Requirement: 1 short caption (wrap 1 keyword in <yellow>), 1 long narrative (250 words). Format: JSON { "short": "", "long": "" }`;
        const gemRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiKey}`, {
            method:'POST', body: JSON.stringify({contents:[{parts:[{text:prompt}]}]})
        }).then(r=>r.json());
        const text = JSON.parse(gemRes.candidates[0].content.parts[0].text.replace(/```json|```/g, ''));

        // 2. FLUX
        const fluxUrl = userData.workers[0];
        const imgBlob = await fetch(fluxUrl, { method:'POST', body: JSON.stringify({prompt: `Cinematic historical ${topic}, highly detailed`}) }).then(r=>r.blob());
        const imgBase64 = await new Promise(r=>{const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(imgBlob);});

        // 3. Save Local
        const isSaved = await saveToLocal(topic, imgBlob, text.long, guild.name);
        
        // 4. Update UI
        loadingMsg.remove();
        const resHtml = `
            <div class="res-card">
                <div class="res-img"><img src="${imgBase64}"/></div>
                <div class="res-body">
                    <div class="save-status">${isSaved ? '✓ Saved to PC' : '☁ Saved to Cloud only'}</div>
                    <div style="font-weight:800; color:var(--accent); margin-bottom:10px;">${text.short}</div>
                    <div style="font-size:12px; color:var(--text2); line-height:1.6">${text.long.substring(0, 150)}...</div>
                </div>
            </div>
        `;
        addChatMessage("system", resHtml);
        
        userData.results.push({ topic, short: text.short, long: text.long, image: imgBase64, guild: guild.name });
        syncToCloud();

    } catch(e) {
        loadingMsg.innerHTML = `<div class="bubble" style="color:var(--accent)">Error: Ensure API keys and Worker URL are set in settings.</div>`;
    }
}

// --- SETTINGS & GUILDS ---
function toggleDrawer() { document.getElementById('drawer').classList.toggle('open'); }

async function saveNewGuild() {
    const name = document.getElementById('new-g-name').value;
    const file = document.getElementById('new-g-logo').files[0];
    if(!name) return;
    let logo = '';
    if(file) logo = await new Promise(r=>{const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(file);});
    
    userData.profiles.push({ id: Date.now(), name, logo });
    document.getElementById('new-g-name').value = '';
    renderGuilds();
    syncToCloud();
}

function renderGuilds() {
    const bar = document.getElementById('guild-bar');
    const existing = bar.querySelectorAll('.guild-chip:not(:last-child)');
    existing.forEach(e=>e.remove());
    
    userData.profiles.forEach(p => {
        const chip = document.createElement('div');
        chip.className = `guild-chip ${activeGuildId === p.id ? 'active' : ''}`;
        chip.onclick = () => { activeGuildId = p.id; renderGuilds(); };
        chip.innerHTML = `<img src="${p.logo || ''}"/><span>${p.name}</span>`;
        bar.insertBefore(chip, bar.lastElementChild);
    });
    if(!activeGuildId && userData.profiles.length > 0) activeGuildId = userData.profiles[0].id;
}

function saveVault() {
    userData.apiKeys[0] = document.getElementById('gemini-key').value;
    userData.workers[0] = document.getElementById('flux-url').value;
    syncToCloud();
    toggleDrawer();
    addChatMessage("system", "Vault keys updated.");
}

function handleCSV(input) {
    Papa.parse(input.files[0], { header: true, complete: (res) => {
        const count = res.data.length;
        addChatMessage("system", `Batch Import: ${count} topics found. Type "Start Batch" to process them.`);
        // In a real app, you'd store these and loop sendMessage
    }});
}
</script>
</body>
</html>
