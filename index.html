<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Historian Engine — Chat Edition</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0a0a0c; --surface: #121217; --surface2: #1c1c24; --border: rgba(255,255,255,0.08);
  --accent: #c8ff00; --red: #ff4f4f; --green: #3dffa0; --text: #f0f0f5; --text2: #9494a5;
  --font: 'Syne', sans-serif; --mono: 'DM Mono', monospace; --sidebar-w: 280px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}

/* --- AUTH --- */
#auth-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:2000}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:32px;padding:40px;width:380px;text-align:center}
.pin-digit{background:var(--surface2);border:1px solid var(--border);border-radius:14px;height:65px;font-size:28px;text-align:center;color:var(--accent);width:60px;margin:0 5px;outline:none;font-family:var(--mono)}

/* --- LAYOUT --- */
.sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px;z-index:100}
.main-chat{flex:1;display:flex;flex-direction:column;background:var(--bg);position:relative}

/* --- SIDEBAR COMPONENTS --- */
.sidebar-btn{width:100%;padding:14px;background:var(--surface2);border:1px solid var(--border);border-radius:14px;color:var(--text);font-weight:800;cursor:pointer;margin-bottom:20px;display:flex;align-items:center;justify-content:center;gap:10px}
.bucket-list{flex:1;overflow-y:auto}
.bucket-item{padding:12px;border-radius:12px;cursor:pointer;margin-bottom:8px;font-size:14px;color:var(--text2);display:flex;justify-content:space-between;align-items:center;transition:0.2s}
.bucket-item:hover{background:rgba(255,255,255,0.03)}
.bucket-item.active{background:var(--accent);color:#000;font-weight:700}

/* --- CHAT AREA --- */
.chat-window{flex:1;overflow-y:auto;padding:40px;display:flex;flex-direction:column;gap:30px}
.message{max-width:85%;display:flex;flex-direction:column;gap:10px}
.message.system{align-self:flex-start}
.message.user{align-self:flex-end;text-align:right}

.bubble{padding:20px;border-radius:24px;background:var(--surface);border:1px solid var(--border);line-height:1.6}
.message.user .bubble{background:var(--accent);color:#000;font-weight:600}

.action-bubble{background:var(--surface2);border:1px dashed var(--border);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:15px}

/* --- IMAGE CARDS IN CHAT --- */
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;overflow:hidden;display:grid;grid-template-columns:300px 1fr}
.result-img img{width:100%;height:auto;display:block}
.result-body{padding:20px}

/* --- FOOTER / INPUT --- */
.chat-footer{padding:20px 40px;background:var(--surface);border-top:1px solid var(--border);display:flex;flex-direction:column;gap:15px}
.input-row{display:flex;gap:15px;align-items:center}
.chat-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:100px;padding:15px 25px;color:var(--text);outline:none}
.folder-pill{background:rgba(61,255,160,0.1);color:var(--green);padding:6px 15px;border-radius:100px;font-size:11px;font-family:var(--mono);border:1px solid rgba(61,255,160,0.2);cursor:pointer}

/* --- BRAND PICKER --- */
.brand-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px}
.brand-node{min-width:60px;height:60px;background:var(--surface);border:1px solid var(--border);border-radius:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden}
.brand-node.active{border-color:var(--accent);box-shadow:0 0 15px rgba(200,255,0,0.2)}
.brand-node img{width:100%;height:100%;object-fit:cover}

/* --- OVERLAYS --- */
#config-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:500}
.config-card{background:var(--surface);padding:30px;border-radius:24px;width:500px;border:1px solid var(--border)}

.spinner{width:18px;height:18px;border:3px solid rgba(255,255,255,0.1);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-card">
    <h2 style="margin-bottom:30px"> Historian PIN </h2>
    <div style="display:flex; justify-content:center; margin-bottom:20px">
      <input class="pin-digit" id="p0" type="password" maxlength="1" inputmode="numeric"/>
      <input class="pin-digit" id="p1" type="password" maxlength="1" inputmode="numeric"/>
      <input class="pin-digit" id="p2" type="password" maxlength="1" inputmode="numeric"/>
      <input class="pin-digit" id="p3" type="password" maxlength="1" inputmode="numeric"/>
    </div>
    <div id="auth-status" style="font-size:11px; color:var(--text2); margin-bottom:20px">Enter your 4-digit archive code</div>
    <button onclick="submitAuth()" style="width:100%; padding:15px; background:var(--accent); border:none; border-radius:12px; font-weight:900; cursor:pointer">OPEN ARCHIVE</button>
  </div>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar" style="display:none">
  <button class="sidebar-btn" onclick="createNewBucket()">+ New Bucket</button>
  <div class="bucket-list" id="bucket-list"></div>
  <div style="padding-top:20px; border-top:1px solid var(--border)">
    <button class="sidebar-btn" style="background:none" onclick="toggleConfig()">System Settings</button>
  </div>
</div>

<!-- MAIN CHAT -->
<div class="main-chat" id="app" style="display:none">
  <div class="chat-window" id="chat-window">
    <!-- Messages flow here -->
  </div>

  <div class="chat-footer">
    <div class="input-row">
      <div class="folder-pill" id="folder-pill" onclick="connectLocalFolder()">Connect PC Folder: Not Set</div>
      <div id="sync-status" style="font-size:10px; font-family:var(--mono); color:var(--text2)">Cloud Ready</div>
    </div>
    <div class="input-row">
      <input type="text" class="chat-input" id="chat-input" placeholder="Type a topic or use the tools above..."/>
      <button onclick="sendManualTopic()" style="background:var(--accent); border:none; width:50px; height:50px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- CONFIG OVERLAY -->
<div id="config-overlay">
  <div class="config-card">
    <h3 style="margin-bottom:20px">System Config</h3>
    <label style="font-size:10px; font-weight:800; color:var(--text2)">GEMINI API KEY</label>
    <input type="password" id="cfg-gemini" placeholder="AIza..."/>
    <label style="font-size:10px; font-weight:800; color:var(--text2)">FLUX WORKER URL</label>
    <input type="url" id="cfg-worker" placeholder="https://..."/>
    <hr style="border:0; border-top:1px solid var(--border); margin:20px 0"/>
    <h4 style="margin-bottom:10px">Brands (Guilds)</h4>
    <div id="cfg-brands" style="margin-bottom:15px"></div>
    <div style="display:flex; gap:10px">
      <input type="text" id="cfg-brand-name" placeholder="Brand Name"/>
      <input type="file" id="cfg-brand-logo" accept="image/*" style="display:none"/>
      <button class="btn-sm" onclick="document.getElementById('cfg-brand-logo').click()">Logo</button>
      <button class="btn-sm" style="background:var(--accent); color:#000" onclick="addBrandToConfig()">Add</button>
    </div>
    <button onclick="toggleConfig()" style="width:100%; margin-top:20px; padding:10px; border-radius:10px; border:none; cursor:pointer">Close</button>
  </div>
</div>

<script>
const PROXY = 'https://flux-proxey.shreevathsa2k27.workers.dev/';
let currentPin = '';
let userData = { apiKeys: [], profiles: [], buckets: [] };
let currentBucketId = null;
let activeBrandId = null;
let localDirHandle = null;

// --- AUTH ---
[0,1,2,3].forEach(i => {
  const el = document.getElementById('p'+i);
  el.addEventListener('input', () => { if(el.value && i<3) document.getElementById('p'+(i+1)).focus(); });
});
function getPin() { return [0,1,2,3].map(i=>document.getElementById('p'+i).value).join(''); }

async function submitAuth() {
  const pin = getPin();
  try {
    const res = await fetch(PROXY, { method:'POST', body: JSON.stringify({action:'login', pin}) }).then(r=>r.json());
    if(res.error) {
        if(confirm("PIN not found. Create new archive?")) {
            await fetch(PROXY, { method:'POST', body: JSON.stringify({action:'register', pin}) });
        } else return;
    }
    currentPin = pin;
    await loadData();
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('sidebar').style.display = 'flex';
    document.getElementById('app').style.display = 'flex';
  } catch(e){ alert("Auth Error"); }
}

async function loadData() {
    const res = await fetch(PROXY, { method:'POST', body: JSON.stringify({action: 'load', pin: currentPin}) }).then(r=>r.json());
    if(res.data) userData = res.data;
    if(!userData.buckets) userData.buckets = [];
    renderBucketList();
    renderConfigBrands();
}

async function saveData() {
    document.getElementById('sync-status').textContent = 'Syncing...';
    await fetch(PROXY, { method:'POST', body: JSON.stringify({action: 'save', pin: currentPin, data: userData}) });
    document.getElementById('sync-status').textContent = 'Cloud Synced';
}

// --- BUCKETS / CHAT ---
function createNewBucket() {
    const id = Date.now();
    const newBucket = { id, name: "New Batch " + (userData.buckets.length + 1), history: [] };
    userData.buckets.unshift(newBucket);
    switchBucket(id);
    saveData();
    renderBucketList();
}

function switchBucket(id) {
    currentBucketId = id;
    renderBucketList();
    renderChatHistory();
}

function renderBucketList() {
    const list = document.getElementById('bucket-list');
    list.innerHTML = userData.buckets.map(b => `
        <div class="bucket-item ${currentBucketId === b.id ? 'active' : ''}" onclick="switchBucket(${b.id})">
            ${b.name}
        </div>
    `).join('');
}

function addMessageToHistory(msg) {
    const bucket = userData.buckets.find(b => b.id === currentBucketId);
    if(bucket) {
        bucket.history.push(msg);
        renderChatHistory();
        saveData();
    }
}

function renderChatHistory() {
    const window = document.getElementById('chat-window');
    const bucket = userData.buckets.find(b => b.id === currentBucketId);
    window.innerHTML = '';

    if(!bucket) return;

    // Welcome Control Bubble if empty
    if(bucket.history.length === 0) {
        window.innerHTML = `
            <div class="message system">
                <div class="bubble"><b>System Ready.</b> To begin, select a Brand and upload your topic manifest or type a single topic below.</div>
                <div class="action-bubble">
                    <label style="font-size:9px; font-weight:800; color:var(--text2)">1. SELECT ACTIVE BRAND</label>
                    <div class="brand-strip">${renderBrandStrip()}</div>
                    <label style="font-size:9px; font-weight:800; color:var(--text2); margin-top:10px">2. IMPORT TOPICS</label>
                    <input type="file" id="batch-file" accept=".csv,.xlsx" onchange="processBatchFile(this)"/>
                    <label style="font-size:9px; font-weight:800; color:var(--text2); margin-top:10px">3. OR PUSH LOCAL FILES</label>
                    <button class="btn-sm" onclick="pushLocalFilesToCloud()">Select local files to push to Cloud</button>
                </div>
            </div>
        `;
    }

    bucket.history.forEach(h => {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${h.role}`;
        if(h.type === 'result') {
            msgDiv.innerHTML = `
                <div class="result-card">
                    <div class="result-img"><img src="${h.image}"/></div>
                    <div class="result-body">
                        <div style="font-weight:800; color:var(--accent)">${h.short}</div>
                        <div style="font-size:12px; color:var(--text2); margin-top:10px">${h.long}</div>
                    </div>
                </div>
            `;
        } else {
            msgDiv.innerHTML = `<div class="bubble">${h.text}</div>`;
        }
        window.appendChild(msgDiv);
    });
    window.scrollTop = window.scrollHeight;
}

// --- CONTROLS ---
function renderBrandStrip() {
    return userData.profiles.map(p => `
        <div class="brand-node ${activeBrandId === p.id ? 'active' : ''}" onclick="setActiveBrand(${p.id})">
            ${p.logo ? `<img src="${p.logo}"/>` : p.name[0]}
        </div>
    `).join('');
}

function setActiveBrand(id) {
    activeBrandId = id;
    renderChatHistory();
}

async function processBatchFile(input) {
    const file = input.files[0];
    if(!file || !activeBrandId) return alert("Select a Brand first!");
    
    addMessageToHistory({ role:'user', text: `Uploaded manifest: ${file.name}. Start processing.` });

    Papa.parse(file, { header:true, complete: async (res) => {
        const items = res.data.map(r => r.Topic || r.topic);
        for(let t of items) {
            if(t) await runSingleGeneration(t);
        }
    }});
}

async function sendManualTopic() {
    const inp = document.getElementById('chat-input');
    const t = inp.value.trim();
    if(!t || !activeBrandId) return alert("Select Brand and enter topic!");
    inp.value = '';
    addMessageToHistory({ role:'user', text: t });
    await runSingleGeneration(t);
}

async function runSingleGeneration(topic) {
    const brand = userData.profiles.find(p => p.id === activeBrandId);
    const geminiKey = document.getElementById('cfg-gemini').value || userData.apiKeys[0];
    const workerUrl = document.getElementById('cfg-worker').value || userData.workers[0];

    try {
        // Text
        const prompt = `Create viral post for "${brand.name}" about ${topic}. Return JSON: {"short": "8 word caption with <yellow>", "long": "250 word story"}`;
        const tRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiKey}`, {
            method:'POST', body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        }).then(r=>r.json());
        const content = JSON.parse(tRes.candidates[0].content.parts[0].text.replace(/```json|```/g, ''));

        // Image
        const iRes = await fetch(workerUrl, { method:'POST', body: JSON.stringify({ prompt: `Historical scene: ${topic}, 4k, cinematic` }) }).then(r=>r.blob());
        
        // Convert blob to base64 for cloud storage
        const reader = new FileReader();
        reader.readAsDataURL(iRes);
        reader.onloadend = async () => {
            const base64 = reader.result;
            const msg = { role:'system', type:'result', topic, short: content.short, long: content.long, image: base64 };
            addMessageToHistory(msg);

            // AUTO-SAVE TO PC
            if(localDirHandle) {
                const brandFolder = await localDirHandle.getDirectoryHandle(brand.name.replace(/[^a-z0-9]/gi, '_'), {create:true});
                const fileHandle = await brandFolder.getFileHandle(`${topic.replace(/[^a-z0-9]/gi, '_')}.jpg`, {create:true});
                const writable = await fileHandle.createWritable();
                await writable.write(iRes);
                await writable.close();
                
                const txtHandle = await brandFolder.getFileHandle(`${topic.replace(/[^a-z0-9]/gi, '_')}.txt`, {create:true});
                const txtWritable = await txtHandle.createWritable();
                await txtWritable.write(content.long);
                await txtWritable.close();
            }
        };
    } catch(e) { console.error(e); }
}

// --- LOCAL PC FOLDER ---
async function connectLocalFolder() {
    try {
        localDirHandle = await window.showDirectoryPicker();
        document.getElementById('folder-pill').textContent = "Saving to: " + localDirHandle.name;
    } catch(e){}
}

async function pushLocalFilesToCloud() {
    // Allows user to pick local images and save them into the current bucket
    const [fileHandle] = await window.showOpenFilePicker({ multiple: true });
    for(const fh of [fileHandle]) {
        const file = await fh.getFile();
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => {
            addMessageToHistory({ role:'system', type:'result', topic: file.name, short: 'Imported File', long: '', image: reader.result });
        };
    }
}

// --- CONFIG ---
function toggleConfig() {
    const overlay = document.getElementById('config-overlay');
    overlay.style.display = overlay.style.display === 'flex' ? 'none' : 'flex';
}

async function addBrandToConfig() {
    const name = document.getElementById('cfg-brand-name').value;
    const logoFile = document.getElementById('cfg-brand-logo').files[0];
    let logo = '';
    if(logoFile) logo = await new Promise(r => { const rd = new FileReader(); rd.onload = () => r(rd.result); rd.readAsDataURL(logoFile); });
    
    userData.profiles.push({ id: Date.now(), name, logo });
    saveData();
    renderConfigBrands();
}

function renderConfigBrands() {
    document.getElementById('cfg-brands').innerHTML = userData.profiles.map(p => `
        <div style="font-size:12px; margin-bottom:5px">${p.name} <span onclick="removeBrand(${p.id})" style="color:var(--red); cursor:pointer">✕</span></div>
    `).join('');
}
</script>
</body>
</html>
