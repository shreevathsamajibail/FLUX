<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Historian Engine — PIN Archive</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0c0c0f; --surface: #111116; --surface2: #18181f; --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13); --text: #f0f0f5; --text2: #7a7a90; --text3: #4a4a60;
  --accent: #c8ff00; --red: #ff4f4f; --red-dim: rgba(255,79,79,0.12); --green: #3dffa0;
  --green-dim:rgba(61,255,160,0.1); --amber: #ffb347; --radius: 18px; --radius-sm:10px;
  --font: 'Syne', sans-serif; --mono: 'DM Mono', monospace; --nav-w: 80px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;overflow-x:hidden}

/* AUTH SCREEN */
#auth-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000}
.auth-card{background:var(--surface);border:1px solid var(--border2);border-radius:28px;padding:44px 48px;width:100%;max-width:400px;text-align:center;box-shadow:0 10px 50px rgba(0,0,0,0.7)}
.auth-logo-icon{width:50px;height:50px;background:var(--accent);border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;color:#000}
.auth-mode-switch{display:flex;gap:4px;background:var(--surface2);border-radius:12px;padding:4px;margin-bottom:28px}
.auth-mode-btn{flex:1;padding:10px;border:none;background:none;color:var(--text3);font-family:var(--font);font-size:11px;font-weight:700;text-transform:uppercase;cursor:pointer;border-radius:9px}
.auth-mode-btn.active{background:var(--surface);color:var(--text)}
.pin-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:10px}
.pin-digit{background:var(--surface2);border:1px solid var(--border);border-radius:12px;height:64px;font-size:28px;font-weight:800;text-align:center;color:var(--text);font-family:var(--mono);outline:none;width:100%}
.pin-digit.filled{border-color:var(--accent);color:var(--accent)}
.pin-status{font-size:10px;font-family:var(--mono);height:20px;margin-bottom:10px}
.auth-btn{width:100%;background:var(--accent);color:#000;border:none;border-radius:12px;padding:16px;font-weight:800;text-transform:uppercase;cursor:pointer;transition:0.2s}
.auth-btn:disabled{opacity:0.4;cursor:not-allowed}
.auth-err{margin-top:15px;background:var(--red-dim);color:var(--red);padding:10px;border-radius:10px;font-size:11px;display:none}

/* MAIN APP */
#app{display:none;width:100%}
.nav{width:var(--nav-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:20px 0;position:fixed;height:100vh}
.nav-item{width:60px;margin-bottom:10px;padding:12px 0;border-radius:12px;cursor:pointer;color:var(--text3);display:flex;flex-direction:column;align-items:center;gap:5px;border:none;background:none}
.nav-item.active{background:rgba(200,255,0,0.1);color:var(--accent)}
.nav-label{font-size:8px;font-weight:700;text-transform:uppercase;font-family:var(--mono)}
main{margin-left:var(--nav-w);flex:1;padding:24px 30px;max-width:1300px}

.topbar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 22px;display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.sync-pill{display:flex;align-items:center;gap:8px;padding:8px 15px;border-radius:100px;border:1px solid var(--border);font-size:10px;font-family:var(--mono);color:var(--text2)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--text3)}
.sync-dot.synced{background:var(--green);box-shadow:0 0 8px var(--green)}
.sync-dot.syncing{background:var(--amber);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:0.3}}

.tab-panel{display:none}
.tab-panel.active{display:block}
.grid{display:grid;grid-template-columns:320px 1fr;gap:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:20px;height:fit-content}
.lbl{display:block;font-size:9px;font-weight:700;text-transform:uppercase;color:var(--text3);margin-bottom:8px;font-family:var(--mono)}
input, select, textarea {width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--text);outline:none;font-family:var(--font);margin-bottom:15px}
.btn{padding:12px 20px;border-radius:100px;font-size:11px;font-weight:700;text-transform:uppercase;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:var(--accent);color:#000}
.btn-danger{background:var(--red-dim);color:var(--red)}

/* FEED */
.feed{display:flex;flex-direction:column;gap:15px}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden;display:grid;grid-template-columns:240px 1fr}
.result-img{background:var(--surface2);display:flex;align-items:center;justify-content:center;min-height:280px}
.result-img img{max-width:100%;height:auto}
.result-info{padding:20px;display:flex;flex-direction:column;gap:10px}
.badge{padding:4px 10px;border-radius:100px;font-size:9px;font-weight:800;text-transform:uppercase;font-family:var(--mono)}
.badge-done{background:var(--green-dim);color:var(--green)}
.badge-pending{background:var(--surface2);color:var(--text3)}
.long-text{font-size:12px;color:var(--text2);line-height:1.6;max-height:150px;overflow-y:auto;border-left:2px solid var(--border);padding-left:15px}

/* GUILDS LIST */
.guild-item{display:flex;align-items:center;gap:15px;padding:12px;background:var(--surface2);border-radius:12px;margin-bottom:10px}
.guild-logo-prev{width:40px;height:40px;background:var(--surface);border-radius:8px;overflow:hidden}
.guild-logo-prev img{width:100%;height:100%;object-fit:cover}

.spinner{width:16px;height:16px;border:2px solid rgba(0,0,0,0.1);border-top-color:#000;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
    <h2 style="margin-bottom:5px">Historian Engine</h2>
    <p style="font-size:12px;color:var(--text2);margin-bottom:25px">CHRONICLE ARCHIVE</p>

    <div class="auth-mode-switch">
      <button class="auth-mode-btn active" id="m-login" onclick="setMode('login')">Login</button>
      <button class="auth-mode-btn" id="m-reg" onclick="setMode('register')">Register</button>
    </div>

    <div class="pin-row">
      <input class="pin-digit" id="p0" type="password" maxlength="1" inputmode="numeric"/>
      <input class="pin-digit" id="p1" type="password" maxlength="1" inputmode="numeric"/>
      <input class="pin-digit" id="p2" type="password" maxlength="1" inputmode="numeric"/>
      <input class="pin-digit" id="p3" type="password" maxlength="1" inputmode="numeric"/>
    </div>
    <div class="pin-status" id="pin-status"></div>

    <button class="auth-btn" id="auth-btn" onclick="submitAuth()">Enter Archive</button>
    <div class="auth-err" id="auth-err"></div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <nav class="nav">
    <div class="nav-item active" onclick="switchTab('build', this)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
      <span class="nav-label">Build</span>
    </div>
    <div class="nav-item" onclick="switchTab('guilds', this)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span class="nav-label">Guilds</span>
    </div>
    <div class="nav-item" onclick="switchTab('workers', this)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      <span class="nav-label">Workers</span>
    </div>
    <div class="nav-item" onclick="switchTab('vault', this)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span class="nav-label">Vault</span>
    </div>
    <div style="margin-top:auto">
        <button class="nav-item" onclick="location.reload()" style="color:var(--red);opacity:0.6">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
    </div>
  </nav>

  <main>
    <div class="topbar">
      <div>
          <div style="font-weight:800; font-size:18px">Historian Engine</div>
          <div style="font-size:9px; color:var(--text2); font-family:var(--mono)">FLUX EDITION</div>
      </div>
      <div class="sync-pill">
          <div class="sync-dot" id="sync-dot"></div>
          <span id="sync-label">Cloud Connected</span>
      </div>
    </div>

    <!-- BUILD TAB -->
    <div id="tab-build" class="tab-panel active">
        <div class="grid">
            <div class="card">
                <label class="lbl">Page Guild</label>
                <select id="sel-profile"><option value="">Select Guild...</option></select>
                
                <label class="lbl">Topic Manifest (CSV/XLSX)</label>
                <input type="file" id="csv-input" accept=".csv,.xlsx" onchange="importTopics(this)"/>
                
                <button class="btn btn-primary" style="width:100%" onclick="processBatch()" id="process-btn" disabled>Process Batch</button>
                <br/><br/>
                <button class="btn btn-outline" style="width:100%" onclick="exportAll()">Export All (.zip)</button>
            </div>
            <div class="feed" id="feed">
                <div style="text-align:center; padding:100px; color:var(--text3); border:2px dashed var(--border); border-radius:20px">
                    Ready to forge history...
                </div>
            </div>
        </div>
    </div>

    <!-- GUILDS TAB -->
    <div id="tab-guilds" class="tab-panel">
        <div class="grid">
            <div class="card">
                <label class="lbl">Guild Name</label>
                <input type="text" id="g-name" placeholder="Ancient Rome"/>
                <label class="lbl">Identity Sigil (Logo)</label>
                <input type="file" id="g-logo" accept="image/*"/>
                <button class="btn btn-primary" style="width:100%" onclick="addGuild()">Register Guild</button>
            </div>
            <div id="guilds-list"></div>
        </div>
    </div>

    <!-- WORKERS TAB -->
    <div id="tab-workers" class="tab-panel">
        <div class="card" style="max-width:600px">
            <label class="lbl">Cloudflare Worker URL</label>
            <input type="url" id="w-url" placeholder="https://flux-gen.yourname.workers.dev/"/>
            <button class="btn btn-primary" onclick="addWorker()">Add Worker</button>
            <hr style="border:0; border-top:1px solid var(--border); margin:20px 0"/>
            <div id="workers-list"></div>
        </div>
    </div>

    <!-- VAULT TAB -->
    <div id="tab-vault" class="tab-panel">
        <div class="card" style="max-width:600px">
            <label class="lbl">Gemini API Key</label>
            <div style="display:flex; gap:10px">
                <input type="password" id="v-key" placeholder="AIza..."/>
                <button class="btn btn-primary" onclick="addKey()">Add Key</button>
            </div>
            <div id="keys-list" style="margin-top:20px"></div>
        </div>
    </div>
  </main>
</div>

<script>
// UPDATE THIS TO YOUR PROXY URL
const PROXY = 'https://flux-proxey.shreevathsa2k27.workers.dev/';

let userData = { apiKeys: [], profiles: [], results: [], workers: [] };
let authMode = 'login';
let currentPin = '';
let topics = [];

// PIN INPUT LOGIC
[0,1,2,3].forEach(i => {
    const el = document.getElementById('p'+i);
    el.addEventListener('input', () => {
        if(el.value) el.classList.add('filled');
        if(el.value && i<3) document.getElementById('p'+(i+1)).focus();
        if(getPin().length === 4 && authMode === 'register') checkPinAvailability();
    });
    el.addEventListener('keydown', e => {
        if(e.key === 'Backspace' && !el.value && i>0) document.getElementById('p'+(i-1)).focus();
    });
});

function getPin() { return [0,1,2,3].map(i=>document.getElementById('p'+i).value).join(''); }

function setMode(m) {
    authMode = m;
    document.getElementById('m-login').classList.toggle('active', m==='login');
    document.getElementById('m-reg').classList.toggle('active', m==='register');
    document.getElementById('auth-btn').textContent = m==='login' ? 'Enter Archive' : 'Create Archive';
    document.getElementById('pin-status').textContent = '';
}

async function checkPinAvailability() {
    const pin = getPin();
    const st = document.getElementById('pin-status');
    st.textContent = 'Checking...';
    try {
        const res = await fetch(PROXY, { method:'POST', body: JSON.stringify({action:'check_pin', pin}) }).then(r=>r.json());
        st.textContent = res.available ? '✓ PIN Available' : '✗ PIN Taken';
        st.style.color = res.available ? '#3dffa0' : '#ff4f4f';
    } catch(e) {}
}

async function submitAuth() {
    const pin = getPin();
    if(pin.length < 4) return;
    const btn = document.getElementById('auth-btn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
    
    try {
        const res = await fetch(PROXY, { method:'POST', body: JSON.stringify({action: authMode, pin}) }).then(r=>r.json());
        if(res.error) throw new Error(res.error);
        
        currentPin = pin;
        await loadData();
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
    } catch(e) {
        const err = document.getElementById('auth-err');
        err.textContent = e.message; err.style.display = 'block';
    } finally {
        btn.disabled = false; btn.innerHTML = authMode==='login'?'Enter Archive':'Create Archive';
    }
}

async function loadData() {
    const res = await fetch(PROXY, { method:'POST', body: JSON.stringify({action: 'load', pin: currentPin}) }).then(r=>r.json());
    if(res.data) userData = res.data;
    renderAll();
}

async function saveData() {
    document.getElementById('sync-dot').className = 'sync-dot syncing';
    try {
        await fetch(PROXY, { method:'POST', body: JSON.stringify({action: 'save', pin: currentPin, data: userData}) });
        document.getElementById('sync-dot').className = 'sync-dot synced';
    } catch(e) {}
}

// UI LOGIC
function switchTab(t, btn) {
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
    document.getElementById('tab-'+t).classList.add('active');
    btn.classList.add('active');
}

function renderAll() {
    renderProfiles();
    renderKeys();
    renderWorkers();
    renderFeed();
}

// PROFILE LOGIC
async function addGuild() {
    const name = document.getElementById('g-name').value;
    const file = document.getElementById('g-logo').files[0];
    if(!name) return;
    let logo = '';
    if(file) {
        logo = await new Promise(r => { const rd = new FileReader(); rd.onload = () => r(rd.result); rd.readAsDataURL(file); });
    }
    userData.profiles.push({ id: Date.now(), name, logo });
    saveData(); renderProfiles();
}

function renderProfiles() {
    const sel = document.getElementById('sel-profile');
    sel.innerHTML = '<option value="">Select Guild...</option>' + userData.profiles.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    
    document.getElementById('guilds-list').innerHTML = userData.profiles.map(p => `
        <div class="guild-item">
            <div class="guild-logo-prev">${p.logo ? `<img src="${p.logo}"/>` : ''}</div>
            <div style="flex:1"><b>${p.name}</b></div>
            <button class="btn-danger btn" onclick="removeGuild(${p.id})">Remove</button>
        </div>
    `).join('');
}
function removeGuild(id) { userData.profiles = userData.profiles.filter(p=>p.id!==id); saveData(); renderProfiles(); }

// KEY LOGIC
function addKey() {
    const k = document.getElementById('v-key').value;
    if(k) { userData.apiKeys.push(k); document.getElementById('v-key').value=''; saveData(); renderKeys(); }
}
function renderKeys() {
    document.getElementById('keys-list').innerHTML = userData.apiKeys.map((k, i) => `
        <div style="display:flex; justify-content:space-between; margin-bottom:5px; background:var(--surface2); padding:10px; border-radius:8px">
            <span>AIza...${k.slice(-5)}</span>
            <button onclick="removeKey(${i})" style="color:var(--red); border:0; background:none; cursor:pointer">Remove</button>
        </div>
    `).join('');
}
function removeKey(i) { userData.apiKeys.splice(i,1); saveData(); renderKeys(); }

// WORKER LOGIC
function addWorker() {
    const u = document.getElementById('w-url').value;
    if(u) { userData.workers.push(u); document.getElementById('w-url').value=''; saveData(); renderWorkers(); }
}
function renderWorkers() {
    document.getElementById('workers-list').innerHTML = userData.workers.map((w, i) => `
        <div style="padding:10px; background:var(--surface2); margin-bottom:5px; border-radius:8px; display:flex; justify-content:space-between">
            <span style="font-size:11px">${w}</span>
            <button onclick="removeWorker(${i})" style="color:var(--red); background:none; border:0; cursor:pointer">✕</button>
        </div>
    `).join('');
}
function removeWorker(i) { userData.workers.splice(i,1); saveData(); renderWorkers(); }

// ENGINE LOGIC
function importTopics(input) {
    const file = input.files[0];
    if(!file) return;
    const ext = file.name.split('.').pop().toLowerCase();
    if(ext === 'csv') {
        Papa.parse(file, { header: true, complete: (res) => { topics = res.data.map(r => r.Topic || r.topic); updateBtn(); } });
    } else {
        const reader = new FileReader();
        reader.onload = (e) => {
            const wb = XLSX.read(e.target.result, { type: 'binary' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            topics = XLSX.utils.sheet_to_json(ws).map(r => r.Topic || r.topic);
            updateBtn();
        };
        reader.readAsBinaryString(file);
    }
}

function updateBtn() { document.getElementById('process-btn').disabled = (topics.length === 0 || userData.profiles.length === 0 || userData.apiKeys.length === 0); }

async function processBatch() {
    const guildId = document.getElementById('sel-profile').value;
    const guild = userData.profiles.find(p => p.id == guildId);
    if(!guild) return;

    document.getElementById('process-btn').disabled = true;
    const feed = document.getElementById('feed');
    feed.innerHTML = '';

    for(let topic of topics) {
        if(!topic) continue;
        const resultId = Date.now();
        const card = document.createElement('div');
        card.className = 'result-card';
        card.id = 'res-' + resultId;
        card.innerHTML = `<div class="result-img"><span class="spinner"></span></div><div class="result-info"><b>${topic}</b><span class="badge badge-pending">Processing...</span></div>`;
        feed.prepend(card);

        try {
            // 1. Gemini Text
            const prompt = `Write a viral historical post about ${topic} for "${guild.name}". 1 short punchy caption (max 8 words, wrap 1 word in <yellow>). 1 long detailed story (250 words). Format: JSON { "short": "", "long": "" }`;
            const gemRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${userData.apiKeys[0]}`, {
                method: 'POST', body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            }).then(r => r.json());
            const text = JSON.parse(gemRes.candidates[0].content.parts[0].text.replace(/```json|```/g, ''));

            // 2. FLUX Image
            const imgRes = await fetch(userData.workers[0], {
                method: 'POST', body: JSON.stringify({ prompt: `Cinematic historical scene of ${topic}, ultra-realistic, 4k` })
            }).then(r => r.blob());
            const imgUrl = URL.createObjectURL(imgRes);

            // 3. Update UI
            card.innerHTML = `
                <div class="result-img"><img src="${imgUrl}"/></div>
                <div class="result-info">
                    <div style="display:flex; justify-content:space-between"><b>${topic}</b><span class="badge badge-done">Done</span></div>
                    <div style="font-weight:800; color:var(--accent)">${text.short}</div>
                    <div class="long-text">${text.long}</div>
                </div>
            `;
            userData.results.push({ topic, short: text.short, long: text.long, image: imgUrl, guild: guild.name });
        } catch(e) {
            card.innerHTML += `<div style="color:var(--red); font-size:10px">Error: ${e.message}</div>`;
        }
    }
    saveData();
    document.getElementById('process-btn').disabled = false;
}

function renderFeed() {
    if(userData.results.length === 0) return;
    const feed = document.getElementById('feed');
    feed.innerHTML = userData.results.map(r => `
        <div class="result-card">
            <div class="result-img"><img src="${r.image}"/></div>
            <div class="result-info">
                <div style="display:flex; justify-content:space-between"><b>${r.topic}</b><span class="badge badge-done">Saved</span></div>
                <div style="font-weight:800; color:var(--accent)">${r.short}</div>
                <div class="long-text">${r.long}</div>
            </div>
        </div>
    `).join('');
}

async function exportAll() {
    if(userData.results.length === 0) return;
    const zip = new JSZip();
    userData.results.forEach((res, i) => {
        zip.file(`${i}_${res.topic}.txt`, `${res.short}\n\n${res.long}`);
    });
    const content = await zip.generateAsync({type:"blob"});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(content);
    link.download = "history_archive.zip";
    link.click();
}

</script>
</body>
</html>
