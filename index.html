<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Historian Engine — Chat Edition</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0c0c0f; --surface: #111116; --surface2: #18181f; --border: rgba(255,255,255,0.08);
  --accent: #c8ff00; --red: #ff4f4f; --green: #3dffa0; --text: #f0f0f5; --text2: #7a7a90;
  --font: 'Syne', sans-serif; --mono: 'DM Mono', monospace; --sidebar-w: 300px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}

/* --- AUTH --- */
#auth-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:2000}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:32px;padding:40px;width:380px;text-align:center}
.pin-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}
.pin-digit{background:var(--surface2);border:1px solid var(--border);border-radius:14px;height:65px;font-size:28px;text-align:center;color:var(--accent);outline:none;width:100%;font-family:var(--mono)}

/* --- LAYOUT --- */
.sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:25px;transition: transform 0.3s}
.chat-container{flex:1;display:flex;flex-direction:column;background:var(--bg);position:relative}

/* --- CHAT AREA --- */
.chat-messages{flex:1;overflow-y:auto;padding:40px;display:flex;flex-direction:column;gap:25px;scroll-behavior: smooth}
.msg{max-width:80%;display:flex;flex-direction:column;gap:8px}
.msg-bot{align-self:flex-start}
.msg-user{align-self:flex-end;text-align:right}

.bubble{padding:16px 20px;border-radius:20px;font-size:14px;line-height:1.5;position:relative}
.msg-bot .bubble{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg-user .bubble{background:var(--accent);color:#000;font-weight:700;border-bottom-right-radius:4px}

/* --- BRAND SELECTOR IN CHAT --- */
.brand-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(100px, 1fr));gap:10px;margin-top:10px}
.brand-card{background:var(--surface2);border:1px solid var(--border);border-radius:15px;padding:12px;text-align:center;cursor:pointer;transition:0.2s}
.brand-card:hover{border-color:var(--accent);transform:translateY(-3px)}
.brand-card img{width:40px;height:40px;border-radius:8px;object-fit:cover;margin-bottom:8px}
.brand-card span{display:block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px}

/* --- INPUT AREA --- */
.chat-input-area{padding:20px 40px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;gap:15px}
.input-box{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:100px;padding:14px 25px;color:#fff;outline:none;font-family:var(--font)}
.icon-btn{background:none;border:none;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.2s}
.icon-btn:hover{color:var(--accent)}
.icon-btn.active{color:var(--green)}

/* --- VAULT / SETTINGS --- */
.vault-section{margin-bottom:30px}
.vault-label{font-size:10px;font-weight:800;color:var(--text2);text-transform:uppercase;margin-bottom:12px;display:block}
.vault-item{background:var(--surface2);padding:10px;border-radius:10px;margin-bottom:8px;font-size:11px;display:flex;justify-content:space-between;align-items:center}

/* --- GENERATION RESULT --- */
.gen-result{background:var(--surface);border:1px solid var(--border);border-radius:24px;overflow:hidden;margin-top:15px;width:100%;max-width:500px}
.gen-img{width:100%;aspect-ratio:1/1.2;background:#000;object-fit:cover}
.gen-info{padding:20px}

.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.1);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="auth-card">
    <h2 style="margin-bottom:10px">Historian Engine</h2>
    <p style="font-size:11px;color:var(--text2);text-transform:uppercase">Enter PIN to Unlock</p>
    <div class="pin-row">
      <input class="pin-digit" id="p0" type="password" maxlength="1"/>
      <input class="pin-digit" id="p1" type="password" maxlength="1"/>
      <input class="pin-digit" id="p2" type="password" maxlength="1"/>
      <input class="pin-digit" id="p3" type="password" maxlength="1"/>
    </div>
    <button class="auth-btn" style="width:100%;background:var(--accent);padding:15px;border:none;border-radius:12px;font-weight:900;cursor:pointer" onclick="submitAuth()">OPEN VAULT</button>
  </div>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar" style="display:none">
  <div class="vault-section">
    <span class="vault-label">Brands & Identities</span>
    <input type="text" id="new-brand-name" placeholder="Brand Name" style="width:100%;background:var(--surface2);border:1px solid var(--border);padding:8px;color:#fff;border-radius:8px;margin-bottom:5px"/>
    <input type="file" id="new-brand-logo" style="font-size:10px;margin-bottom:10px"/>
    <button onclick="addBrand()" style="width:100%;background:var(--accent);border:none;padding:8px;border-radius:8px;font-weight:800;font-size:11px;cursor:pointer">ADD BRAND</button>
    <div id="sidebar-brands" style="margin-top:15px"></div>
  </div>

  <div class="vault-section">
    <span class="vault-label">Engine Config</span>
    <input type="password" id="new-key" placeholder="Gemini Key" style="width:100%;background:var(--surface2);border:1px solid var(--border);padding:8px;color:#fff;border-radius:8px;margin-bottom:5px"/>
    <input type="url" id="new-worker" placeholder="Worker URL" style="width:100%;background:var(--surface2);border:1px solid var(--border);padding:8px;color:#fff;border-radius:8px;margin-bottom:10px"/>
    <button onclick="addConfig()" style="width:100%;background:var(--surface2);border:1px solid var(--border);padding:8px;color:var(--accent);border-radius:8px;font-weight:800;font-size:11px;cursor:pointer">SAVE CONFIG</button>
    <div id="sidebar-configs" style="margin-top:15px"></div>
  </div>

  <div style="margin-top:auto">
    <button onclick="location.reload()" style="background:none;border:none;color:var(--text2);font-size:10px;font-weight:800;cursor:pointer">LOGOUT</button>
  </div>
</div>

<!-- CHAT INTERFACE -->
<div class="chat-container" id="app" style="display:none">
  <div class="chat-messages" id="chat-flow">
    <!-- Messages appear here -->
  </div>

  <div class="chat-input-area">
    <button class="icon-btn" title="Connect PC Folder" onclick="pickFolder()" id="folder-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
    </button>
    <button class="icon-btn" title="Import Topics" onclick="document.getElementById('csv-hidden').click()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </button>
    <input type="file" id="csv-hidden" hidden accept=".csv,.xlsx" onchange="handleTopics(this)"/>
    
    <input type="text" class="input-box" id="user-input" placeholder="Type a topic or use icons to start batch..."/>
    
    <button class="icon-btn" onclick="sendChat()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<script>
const PROXY = 'https://flux-proxey.shreevathsa2k27.workers.dev/';
let currentPin = '';
let userData = { apiKeys: [], profiles: [], workers: [], results: [] };
let selectedBrand = null;
let directoryHandle = null;
let pendingTopics = [];

// --- AUTH ---
[0,1,2,3].forEach(i => {
  const el = document.getElementById('p'+i);
  el.addEventListener('input', () => { if(el.value && i<3) document.getElementById('p'+(i+1)).focus(); });
});

async function submitAuth() {
  const pin = [0,1,2,3].map(i=>document.getElementById('p'+i).value).join('');
  if(pin.length < 4) return;
  
  try {
    const res = await fetch(PROXY, { method:'POST', body: JSON.stringify({action:'load', pin}) }).then(r=>r.json());
    if(res.error) {
      const reg = await fetch(PROXY, { method:'POST', body: JSON.stringify({action:'register', pin}) }).then(r=>r.json());
      if(reg.error) throw new Error(reg.error);
    }
    currentPin = pin;
    if(res.data) userData = res.data;
    startApp();
  } catch(e) { alert(e.message); }
}

function startApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('sidebar').style.display = 'flex';
  document.getElementById('app').style.display = 'flex';
  renderSidebar();
  addBotMsg("Archive unlocked. Which **Brand** are we creating for today?");
  showBrandSelector();
}

// --- CHAT ENGINE ---
function addBotMsg(text) {
  const flow = document.getElementById('chat-flow');
  const div = document.createElement('div');
  div.className = 'msg msg-bot';
  div.innerHTML = `<div class="bubble">${text}</div>`;
  flow.appendChild(div);
  flow.scrollTop = flow.scrollHeight;
  return div;
}

function addUserMsg(text) {
  const flow = document.getElementById('chat-flow');
  const div = document.createElement('div');
  div.className = 'msg msg-user';
  div.innerHTML = `<div class="bubble">${text}</div>`;
  flow.appendChild(div);
  flow.scrollTop = flow.scrollHeight;
}

function showBrandSelector() {
  const flow = document.getElementById('chat-flow');
  const grid = document.createElement('div');
  grid.className = 'brand-grid';
  
  userData.profiles.forEach(p => {
    const card = document.createElement('div');
    card.className = 'brand-card';
    card.innerHTML = `<img src="${p.logo || ''}"/><span>${p.name}</span>`;
    card.onclick = () => selectBrand(p);
    grid.appendChild(card);
  });
  flow.appendChild(grid);
  flow.scrollTop = flow.scrollHeight;
}

function selectBrand(brand) {
  selectedBrand = brand;
  addUserMsg(`Selected: ${brand.name}`);
  addBotMsg(`Perfect. Upload your **CSV/XLSX** topic list using the upload icon, or type a single topic below.`);
}

async function handleTopics(input) {
  const file = input.files[0];
  if(!file) return;
  addUserMsg(`Uploaded manifest: ${file.name}`);
  
  const ext = file.name.split('.').pop().toLowerCase();
  if(ext === 'csv') {
    Papa.parse(file, { header:true, complete: (res) => { 
      pendingTopics = res.data.map(r => r.Topic || r.topic).filter(t=>t);
      promptGeneration();
    }});
  } else {
    const reader = new FileReader();
    reader.onload = (e) => {
      const wb = XLSX.read(e.target.result, { type:'binary' });
      pendingTopics = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]).map(r => r.Topic || r.topic).filter(t=>t);
      promptGeneration();
    };
    reader.readAsBinaryString(file);
  }
}

function promptGeneration() {
  addBotMsg(`Found **${pendingTopics.length} topics**. 
    ${directoryHandle ? `I will save everything into **${directoryHandle.name}**.` : "You haven't linked a local folder yet. Link one now with the folder icon, or I can save them to memory for now."}
    <br/><br/><button onclick="startBatch()" style="background:var(--accent);border:none;padding:10px 20px;border-radius:10px;font-weight:800;cursor:pointer">START GENERATION</button>`);
}

async function startBatch() {
  if(!selectedBrand) return addBotMsg("Please select a brand first.");
  if(userData.apiKeys.length === 0 || userData.workers.length === 0) return addBotMsg("Vault is missing Gemini keys or Worker URLs.");

  addUserMsg("Start Batch Generation");
  
  for(let topic of pendingTopics) {
    const resultMsg = addBotMsg(`Forging history for: **${topic}**... <span class="spinner"></span>`);
    try {
      // 1. Text Generation
      const prompt = `Topic: ${topic} for Brand: ${selectedBrand.name}. Return JSON: {"short": "punchy 8 word caption", "long": "250 word story"}`;
      const gemRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${userData.apiKeys[0]}`, {
        method: 'POST', body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
      }).then(r => r.json());
      const text = JSON.parse(gemRes.candidates[0].content.parts[0].text.replace(/```json|```/g, ''));

      // 2. Image Generation
      const imgBlob = await fetch(userData.workers[0], {
        method: 'POST', body: JSON.stringify({ prompt: `Cinematic historical scene: ${topic}, ultra-detailed` })
      }).then(r => r.blob());
      const imgUrl = URL.createObjectURL(imgBlob);

      // 3. Display
      resultMsg.innerHTML = `
        <div class="gen-result">
          <img src="${imgUrl}" class="gen-img"/>
          <div class="gen-info">
            <div style="color:var(--accent);font-weight:800;margin-bottom:10px">${text.short}</div>
            <div style="font-size:12px;color:var(--text2);line-height:1.6">${text.long.substring(0,150)}...</div>
          </div>
        </div>
      `;

      // 4. Save Locally
      if(directoryHandle) await saveToDisk(topic, imgBlob, text.long);
      
      userData.results.push({ topic, text, img: imgUrl, brand: selectedBrand.name });
    } catch(e) {
      resultMsg.innerHTML = `<div class="bubble" style="color:var(--red)">Failed: ${topic} (${e.message})</div>`;
    }
  }
  addBotMsg("Batch completed. Everything is safe in the archive.");
  saveData();
}

// --- FILE SYSTEM ACCESS ---
async function pickFolder() {
  try {
    directoryHandle = await window.showDirectoryPicker();
    document.getElementById('folder-btn').classList.add('active');
    addBotMsg(`Linked local folder: **${directoryHandle.name}**. All future generations will save here automatically.`);
  } catch(e) {}
}

async function saveToDisk(topic, imgBlob, longText) {
  if(!directoryHandle) return;
  try {
    const safeName = topic.replace(/[^a-z0-9]/gi, '_').toLowerCase().substring(0, 50);
    const brandFolder = await directoryHandle.getDirectoryHandle(selectedBrand.name, { create: true });
    
    // Save Image
    const imgFile = await brandFolder.getFileHandle(`${safeName}.jpg`, { create: true });
    const imgWriter = await imgFile.createWritable();
    await imgWriter.write(imgBlob);
    await imgWriter.close();
    
    // Save Text
    const txtFile = await brandFolder.getFileHandle(`${safeName}.txt`, { create: true });
    const txtWriter = await txtFile.createWritable();
    await txtWriter.write(longText);
    await txtWriter.close();
  } catch(e) { console.error("Save error", e); }
}

// --- SIDEBAR & VAULT ---
async function addBrand() {
  const name = document.getElementById('new-brand-name').value;
  const logoInput = document.getElementById('new-brand-logo');
  if(!name) return;
  let logo = '';
  if(logoInput.files[0]) {
    logo = await new Promise(r => { const rd = new FileReader(); rd.onload = () => r(rd.result); rd.readAsDataURL(logoInput.files[0]); });
  }
  userData.profiles.push({ id: Date.now(), name, logo });
  saveData(); renderSidebar();
}

function addConfig() {
  const key = document.getElementById('new-key').value;
  const worker = document.getElementById('new-worker').value;
  if(key) userData.apiKeys = [key];
  if(worker) userData.workers = [worker];
  saveData(); renderSidebar();
  alert("Configuration saved to Cloud.");
}

function renderSidebar() {
  document.getElementById('sidebar-brands').innerHTML = userData.profiles.map(p => `
    <div class="vault-item">
      <span>${p.name}</span>
      <button onclick="removeBrand(${p.id})" style="background:none;border:none;color:var(--red);cursor:pointer">✕</button>
    </div>
  `).join('');
  
  document.getElementById('sidebar-configs').innerHTML = `
    <div class="vault-item"><span>Key: ${userData.apiKeys.length ? 'SET' : 'MISSING'}</span></div>
    <div class="vault-item"><span>Worker: ${userData.workers.length ? 'SET' : 'MISSING'}</span></div>
  `;
}

function removeBrand(id) { userData.profiles = userData.profiles.filter(p=>p.id!==id); saveData(); renderSidebar(); }

async function saveData() {
  await fetch(PROXY, { method:'POST', body: JSON.stringify({action:'save', pin: currentPin, data: userData}) });
}

function sendChat() {
  const inp = document.getElementById('user-input');
  if(!inp.value) return;
  const val = inp.value;
  addUserMsg(val);
  inp.value = '';
  
  if(!selectedBrand) {
    addBotMsg("I need a Brand first. Choose one from the list above.");
    showBrandSelector();
  } else {
    pendingTopics = [val];
    startBatch();
  }
}
</script>
</body>
</html>
